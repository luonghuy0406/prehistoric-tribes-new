<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prehistoric Tribes - HD Web Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #0e130c;
      font-family: 'Inter', sans-serif;
      color: #fef3c7;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Carved Wood & Stitched Hide Parchment Frame using ui_dialogue_panel.png */
    .hide-panel {
      position: relative;
      pointer-events: auto;
      border-style: solid;
      border-width: 18px;
      border-image-source: url('./assets/images/sprites_hd/ui_dialogue_panel.png');
      border-image-slice: 62 62 62 62 fill;
      border-image-width: 20px;
      border-image-repeat: stretch;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.72));
    }

    .hide-inner {
      background: linear-gradient(180deg, rgba(35, 21, 12, 0.88) 0%, rgba(22, 13, 8, 0.92) 100%);
      border: 1px solid rgba(217, 119, 6, 0.45);
      border-radius: 6px;
      padding: 8px 10px;
    }

    /* TOP CARVED STONE BANNER using ui_resource_banner.png */
    #hud-top-bar {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: min(98vw, 1340px);
      min-height: 68px;
      padding: 10px 38px;
      background: url('./assets/images/sprites_hd/ui_resource_banner.png') no-repeat center center / 100% 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 25;
      pointer-events: auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.75));
    }

    .top-left-group, .top-right-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .crest-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(180deg, rgba(44, 24, 12, 0.92) 0%, rgba(28, 16, 8, 0.95) 100%);
      border: 2px solid #b45309;
      border-radius: 9px;
      padding: 3px 10px 3px 5px;
      box-shadow: inset 0 1px 0 rgba(251, 191, 36, 0.25);
    }

    .crest-badge img {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      object-fit: cover;
    }

    #level-badge {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 12.5px;
      color: #fde047;
      text-shadow: 0 1px 3px #000;
    }

    .objective-pill {
      max-width: 260px;
      font-size: 11px;
      font-weight: 600;
      color: #fef3c7;
      background: rgba(24, 15, 9, 0.85);
      border: 1px solid #92400e;
      border-radius: 6px;
      padding: 4px 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .res-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(180deg, rgba(28, 18, 11, 0.9) 0%, rgba(17, 11, 7, 0.94) 100%);
      border: 1.5px solid #92400e;
      border-radius: 8px;
      padding: 3px 8px;
      font-weight: 800;
      font-size: 12.5px;
      color: #fef3c7;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.65);
    }

    .res-icon-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }

    .top-btn {
      background: linear-gradient(180deg, #6b3d1e 0%, #3d2211 100%);
      border: 1.5px solid #d97706;
      color: #fef3c7;
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.14s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
    }
    .top-btn:hover { border-color: #fde047; color: #fde047; transform: translateY(-1px); }
    .top-btn.active { background: linear-gradient(180deg, #166534 0%, #14532d 100%); border-color: #4ade80; color: #bbf7d0; }

    /* LEFT HIDE INSPECTOR PANEL */
    #inspector-panel {
      position: absolute;
      top: 80px;
      left: 10px;
      width: 306px;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      display: none;
      font-size: 12px;
      line-height: 1.5;
      z-index: 15;
    }

    .insp-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(217, 119, 6, 0.4);
    }

    .insp-btn {
      flex: 1 1 30%;
      background: url('./assets/images/sprites_hd/ui_btn_frame_1.png') no-repeat center center / 100% 100%;
      border: none;
      color: #fef3c7;
      padding: 8px 6px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      text-align: center;
      text-shadow: 0 1px 2px #000;
    }
    .insp-btn:hover:not(:disabled) { filter: brightness(1.18) drop-shadow(0 0 6px rgba(250, 204, 21, 0.45)); transform: translateY(-1px); }
    .insp-btn.active { filter: sepia(0.2) hue-rotate(85deg) brightness(1.2); color: #bbf7d0; }
    .insp-btn.danger { filter: hue-rotate(-30deg) saturate(1.4); color: #fecaca; }
    .insp-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .warrior-badge {
      display: inline-block;
      margin-top: 2px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
      border: 1px solid #facc15;
      color: #fef08a;
    }

    .warrior-stat-box {
      margin-top: 6px;
      padding: 6px 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #78350f;
      border-radius: 6px;
      font-size: 11px;
      color: #e2e8f0;
    }

    .skill-row {
      margin-top: 4px;
      padding: 4px 7px;
      background: rgba(120, 53, 15, 0.42);
      border-radius: 5px;
      font-size: 11px;
      color: #fde68a;
    }

    /* RIGHT SIDE STACK (MINIMAP + ALERTS + DIALOGUE) */
    #right-column {
      position: absolute;
      top: 80px;
      right: 10px;
      width: 266px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 15;
      pointer-events: none;
    }

    #minimap-canvas {
      display: block;
      width: 100%;
      height: 132px;
      border-radius: 6px;
      border: 2px solid #78350f;
      background: #0c0a09;
      cursor: pointer;
    }

    .minimap-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 10.5px;
      color: #e7e5e4;
    }

    #alert-banner {
      display: none;
      padding: 9px 12px;
      background: linear-gradient(180deg, rgba(153, 27, 27, 0.96) 0%, rgba(100, 18, 18, 0.96) 100%);
      border: 2px solid #fca5a5;
      border-radius: 9px;
      color: #fef2f2;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
    }

    .dialogue-header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 6px;
    }

    .dialogue-avatar-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #f59e0b;
      background: #2d1b0f;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    .dialogue-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

    #dialogue-speaker {
      font-family: 'Cinzel', serif;
      color: #fde047;
      font-size: 13.5px;
      font-weight: 800;
    }

    #dialogue-text {
      font-size: 11.5px;
      line-height: 1.45;
      color: #f1f5f9;
      font-style: italic;
      max-height: 82px;
      overflow-y: auto;
      margin-bottom: 7px;
    }

    /* BOTTOM STONE-FRAMED BUILD & COMMAND DOCK */
    #action-dock {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
      z-index: 25;
      background: linear-gradient(180deg, rgba(44, 28, 17, 0.92) 0%, rgba(24, 15, 9, 0.96) 100%);
      border: 2px solid #a16207;
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(253, 224, 71, 0.25);
      pointer-events: auto;
    }

    .btn-build, .btn-cmd {
      position: relative;
      width: 66px;
      height: 68px;
      background: url('./assets/images/sprites_hd/ui_btn_frame_1.png') no-repeat center center / 100% 100%;
      border: none;
      padding: 6px 5px 5px 5px;
      color: #fef08a;
      font-weight: 800;
      font-size: 9.5px;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      text-shadow: 0 1px 3px #000;
    }

    .btn-build img, .btn-cmd img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.75));
      margin-top: 2px;
    }

    .btn-build span, .btn-cmd span {
      display: block;
      font-size: 8.5px;
      color: #fde68a;
      background: rgba(15, 10, 6, 0.85);
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid rgba(180, 83, 9, 0.55);
      line-height: 1.1;
    }

    .btn-build:hover, .btn-cmd:hover {
      background-image: url('./assets/images/sprites_hd/ui_btn_frame_2.png');
      transform: translateY(-3px) scale(1.04);
      filter: brightness(1.12) drop-shadow(0 4px 10px rgba(250, 204, 21, 0.4));
    }

    .btn-build.active, .btn-cmd.active {
      background-image: url('./assets/images/sprites_hd/ui_btn_frame_2.png');
      filter: drop-shadow(0 0 10px #4ade80) saturate(1.25);
      transform: translateY(-3px);
    }

    .btn-build.locked { opacity: 0.4; }
    .btn-cmd.danger { filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.55)); }
    .btn-cmd.danger.active { filter: drop-shadow(0 0 12px #ef4444) saturate(1.3); }

    .dock-sep {
      width: 3px;
      height: 50px;
      background: linear-gradient(180deg, transparent, #b45309, transparent);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* FULLSCREEN GRAPHICAL OVERLAYS */
    #overlay-backdrop {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(20, 14, 9, 0.65) 0%, rgba(7, 8, 6, 0.88) 100%);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: auto;
      padding: 16px;
    }
    #overlay-backdrop.hidden { display: none; }

    .modal-card {
      width: 100%;
      max-width: 860px;
      max-height: 92vh;
      overflow-y: auto;
      border-style: solid;
      border-width: 24px;
      border-image-source: url('./assets/images/sprites_hd/ui_dialogue_panel.png');
      border-image-slice: 66 66 66 66 fill;
      border-image-width: 26px;
      border-image-repeat: stretch;
      filter: drop-shadow(0 24px 64px rgba(0, 0, 0, 0.88));
      color: #fef3c7;
    }

    .modal-inner {
      background: linear-gradient(180deg, rgba(32, 19, 10, 0.9) 0%, rgba(19, 11, 6, 0.94) 100%);
      border: 1px solid rgba(217, 119, 6, 0.5);
      border-radius: 8px;
      padding: 20px 24px;
    }

    .modal-banner-title {
      background: url('./assets/images/sprites_hd/ui_resource_banner.png') no-repeat center center / 100% 100%;
      padding: 16px 42px;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 900;
      color: #fde047;
      text-shadow: 0 2px 6px #000;
      margin-bottom: 6px;
    }

    .modal-sub {
      text-align: center;
      color: #fcd34d;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .hero-menu-split {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
      align-items: start;
    }

    .splash-art-box {
      position: relative;
      border: 3px solid #92400e;
      border-radius: 12px;
      overflow: hidden;
      background: #141b10;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.75);
    }

    .splash-art-box img.key-art {
      display: block;
      width: 100%;
      height: auto;
    }

    .splash-caption {
      padding: 8px 10px;
      background: rgba(20, 12, 7, 0.94);
      border-top: 1px solid #92400e;
      font-size: 11px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, #52321c 0%, #311d10 100%);
      border: 2px solid #b45309;
      border-radius: 10px;
      padding: 10px 12px;
      color: #fef3c7;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      box-shadow: inset 0 1px 0 rgba(253, 224, 71, 0.2), 0 4px 10px rgba(0, 0, 0, 0.45);
    }
    .menu-btn:hover:not(:disabled) { border-color: #fde047; transform: translateY(-2px); background: #653d22; }
    .menu-btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .menu-btn img.card-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 1.5px solid #d97706;
      object-fit: cover;
      background: #1c120b;
      flex-shrink: 0;
    }
    .menu-btn .small-desc { display: block; font-size: 11px; color: #cbd5e1; font-weight: 400; margin-top: 2px; line-height: 1.35; }

    .codex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .codex-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid #92400e;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 11.5px;
    }
    .codex-item img { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(217, 119, 6, 0.45);
    }

    .btn-primary {
      background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
      border: 2px solid #4ade80;
      color: #fff;
      font-weight: 800;
      border-radius: 8px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-secondary {
      background: linear-gradient(180deg, #573620 0%, #3b2313 100%);
      border: 2px solid #d97706;
      color: #fde047;
      font-weight: 700;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }

    .cutscene-speaker-box {
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(15, 23, 42, 0.62);
      border: 2px solid #b45309;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
    }
    .cutscene-speaker-box img {
      width: 96px; height: 96px; border-radius: 12px;
      border: 2px solid #facc15; background: #2d1b0f; object-fit: cover; flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
    }

    .results-table, .roster-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }
    .results-table td, .roster-table th, .roster-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(180, 83, 9, 0.45);
    }
    .results-table td:last-child { text-align: right; font-weight: 800; color: #fde047; }
    .roster-row { cursor: pointer; }
    .roster-row:hover { background: rgba(245, 158, 11, 0.16); }

    @media (max-width: 980px) {
      #hud-top-bar { padding: 8px 18px; }
      #right-column { width: 210px; }
      #inspector-panel { width: 260px; }
      .objective-pill { display: none; }
      .hero-menu-split { grid-template-columns: 1fr; }
      .splash-art-box { max-width: 240px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-layer">
    <!-- TOP CARVED STONE RESOURCE BANNER -->
    <div id="hud-top-bar">
      <div class="top-left-group">
        <div class="crest-badge">
          <img src="./assets/images/icon.png" alt="Logo" />
          <div id="level-badge">Avnotaklu • Màn 0</div>
        </div>
        <div id="objective-pill" class="objective-pill">Chuẩn bị rời hang...</div>
      </div>

      <div class="top-right-group">
        <div class="res-item" title="Thực phẩm thô / Bữa ăn chín (Kitchen)">
          <img class="res-icon-img" src="./assets/images/sprites_hd/icon_food_meat.png" alt="Food" />
          <span id="res-food">40</span>
          <span style="color:#4ade80;font-size:10.5px;" id="res-meals">(+0)</span>
        </div>
        <div class="res-item" title="Gỗ">
          <img class="res-icon-img" src="./assets/images/sprites_hd/icon_wood_logs.png" alt="Wood" />
          <span id="res-wood">40</span>
        </div>
        <div class="res-item" title="Đá">
          <img class="res-icon-img" src="./assets/images/sprites_hd/node_stone_boulder.png" alt="Stone" />
          <span id="res-stone">25</span>
        </div>
        <div class="res-item" title="Xương">
          <img class="res-icon-img" src="./assets/images/sprites_hd/icon_bones_crossed.png" alt="Bones" />
          <span id="res-bones">0</span>
        </div>
        <div class="res-item" title="Dân số / Sức chứa lều">
          <img class="res-icon-img" src="./assets/images/sprites_hd/icon_pop_chief.png" alt="Pop" />
          <span id="res-pop">0 / 1</span>
        </div>
        <div class="res-item" style="color:#fde047;" title="Chu kỳ Ngày / Đêm">
          <span id="clock-hud">12:00 PM</span>
        </div>
        <button class="top-btn active" id="btn-toggle-fog" title="Bật/Tắt Sương mù chiến tranh">Fog</button>
        <button class="top-btn active" id="btn-toggle-music" title="Nhạc MIDI Gốc [M]">MIDI</button>
        <button class="top-btn" id="btn-roster" title="Danh sách Dân làng [V]">Dân [V]</button>
        <button class="top-btn" id="btn-pause" title="Menu / Tạm dừng [Esc]">Menu</button>
      </div>
    </div>

    <!-- LEFT HIDE INSPECTOR PANEL -->
    <div id="inspector-panel" class="hide-panel"><div class="hide-inner" id="inspector-inner"></div></div>

    <!-- RIGHT SIDEBAR (MINIMAP + ALERTS + STORYTELLER) -->
    <div id="right-column">
      <div id="minimap-box" class="hide-panel">
        <div class="hide-inner">
          <canvas id="minimap-canvas" width="218" height="132"></canvas>
          <div class="minimap-bar">
            <span id="diff-label" style="color:#fde047;font-weight:800;">Chế độ: Easy</span>
            <button class="top-btn" id="btn-jump-alert" style="padding:2px 7px;font-size:10px;">Báo động [1]</button>
          </div>
        </div>
      </div>

      <div id="alert-banner"></div>

      <div id="dialogue-box" class="hide-panel">
        <div class="hide-inner">
          <div class="dialogue-header">
            <div class="dialogue-avatar-wrap">
              <img id="avatar-img" src="./assets/images/portrait_mumbo.jpg" alt="Avatar" />
            </div>
            <div>
              <div id="dialogue-speaker">Mumbo</div>
              <div style="font-size:10px;color:#cbd5e1;">Biên Niên Sử Avnotaklu</div>
            </div>
          </div>
          <div id="dialogue-text">Kỷ Băng Hà đã kết thúc! Tộc Avnotaklu tiến ra thế giới bên ngoài...</div>
          <div style="display:flex;justify-content:space-between;gap:6px;">
            <button class="top-btn" id="btn-replay-cutscene" style="flex:1;">Cốt truyện</button>
            <button class="top-btn" id="btn-next-dialogue" style="flex:1;">Thoại &raquo;</button>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTTOM STONE-FRAMED ACTION & BUILD DOCK -->

      <button class="btn-cmd danger" id="btn-call-to-arms" title="Toàn dân cầm vũ khí ứng chiến [C]">
        <img src="./assets/images/sprites_hd/icon_tools_axe_hammer.png" alt="Arms" />
        <span>C.Arms [C]</span>
      </button>
      <button class="btn-cmd" id="btn-form-up" title="Tập hợp đội hình chiến binh [G]">

        <span>Form [G]</span>
      </button>
      <button class="btn-cmd" id="btn-group-7" title="Click: Chọn nhóm [7] | Shift+7 hoặc RightClick: Lưu nhóm">
        <img src="./assets/images/sprites_hd/icon_pop_caveman.png" alt="Grp7" />
        <span id="grp7-count">[7] 0</span>
      </button>
      <button class="btn-cmd" id="btn-group-9" title="Click: Chọn nhóm [9] | Shift+9 hoặc RightClick: Lưu nhóm">
        <img src="./assets/images/sprites_hd/icon_pop_caveman.png" alt="Grp9" />
        <span id="grp9-count">[9] 0</span>
      </button>

      <div class="dock-sep"></div>

      <button class="btn-build" data-building="hut"><img src="./assets/images/sample_pack/dino_tribe_camp_hide_tent_hut_01.png" alt="Hut" /><span>Hut 15/5</span></button>
      <button class="btn-build" data-building="store"><img src="./assets/images/sprites_hd/bld_storehouse.png" alt="Store" /><span>Store 25/20</span></button>
      <button class="btn-build" data-building="kitchen"><img src="./assets/images/sprites_hd/bld_kitchen.png" alt="Kitchen" /><span>Cook 30/20</span></button>
      <button class="btn-build" data-building="armoury"><img src="./assets/images/sprites_hd/bld_armoury.png" alt="Armoury" /><span>Arms 20/10</span></button>
      <button class="btn-build" data-building="gym"><img src="./assets/images/sprites_hd/bld_training_center.png" alt="Gym" /><span>Gym 40/30</span></button>
      <button class="btn-build" data-building="range"><img src="./assets/images/sprites_hd/proj_javelin.png" alt="Range" /><span>Range 40/30</span></button>
      <button class="btn-build" data-building="sanctuary"><img src="./assets/images/sprites_hd/bld_sanctuary.png" alt="Sanctuary" /><span>Sanc 20S/10B</span></button>
      <button class="btn-build" data-building="pia_center"><img src="./assets/images/sprites_hd/bld_pia_shrine.png" alt="PIA" /><span>PIA 30/15</span></button>
      <button class="btn-build" data-building="disco"><img src="./assets/images/sprites_hd/bld_disco.png" alt="Disco" /><span>Disco 30/25</span></button>
      <button class="btn-build" data-building="nursery"><img src="./assets/images/sprites_hd/bld_nursery.png" alt="Nursery" /><span>Kids 20/10</span></button>
      <button class="btn-build" data-building="tower"><img src="./assets/images/sprites_hd/bld_watchtower.png" alt="Tower" /><span>Tower 10/10</span></button>
    </div>
  </div>

  <!-- GAME SCREENS OVERLAY -->
  <div id="overlay-backdrop">
    <div id="overlay-card" class="modal-card"></div>
  </div>
